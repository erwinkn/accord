Metadata:
  type: object
  required: [name]
  additionalProperties: false
  properties:
    name: { type: string, minLength: 1 }
    description: { type: string, nullable: true }
Asset:
  type: object
  required: [id, name, size]
  additionalProperties: false
  properties:
    id: { type: string }
    name: { type: string }
    size: { type: integer, minimum: 0 }
