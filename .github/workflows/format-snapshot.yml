name: Apply formatting

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'init/typed-openapi-sdk'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.22.0 --activate
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Apply Biome safe fixes
        run: pnpm exec biome check --write . || true
      - name: Commit formatter output and lockfile
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -f pnpm-lock.yaml ]; then
            git add pnpm-lock.yaml
          else
            git add -A
          fi
          if git diff --cached --quiet; then
            echo "No formatter or lockfile changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply Biome formatting and lock dependencies"
          git push origin HEAD:${{ github.head_ref }}
