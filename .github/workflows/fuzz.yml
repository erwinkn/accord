name: Fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      runs:
        description: Number of generated OpenAPI documents
        required: false
        default: "1000"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.22.0 --activate
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Run deterministic corpus and randomized generation
        env:
          ACCORD_FUZZ_RUNS: ${{ inputs.runs || '1000' }}
          ACCORD_FUZZ_SEED: ${{ github.run_id }}
        run: pnpm test:fuzz
