name: SDK contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Contract regression gate (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable && corepack prepare pnpm@11.22.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck:tests
      - name: Test the test infrastructure
        run: pnpm test:harness
      - name: Execute all contracts and check the reviewed gap baseline
        run: pnpm test:conformance
      - name: Install and exercise actual package tarballs outside the workspace
        if: ${{ !cancelled() }}
        run: pnpm test:distribution
      - name: Preserve reports and synthetic reproductions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-contracts-node-${{ matrix.node }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
