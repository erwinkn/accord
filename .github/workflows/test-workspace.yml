name: Prepare test workspace
on:
  push:
    branches: [test/conformance-infrastructure]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@11.22.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Archive isolated development workspace without credentials
        run: tar --exclude=.git --exclude=workspace.tgz -czf /tmp/workspace.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: accord-test-workspace
          path: /tmp/workspace.tgz
          retention-days: 1
