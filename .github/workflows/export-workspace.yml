name: Export workspace

on:
  pull_request:
    paths:
      - ".github/workflows/export-workspace.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Package workspace
        run: tar --exclude=.git -czf /tmp/accord-source.tgz .

      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: accord-source
          path: /tmp/accord-source.tgz
          if-no-files-found: error
          retention-days: 1
