name: Apply validated cleanup

on:
  push:
    branches:
      - chore/anti-slop-cleanup
    paths:
      - ".github/cleanup.patch.ready"

permissions:
  contents: write

concurrency:
  group: apply-anti-slop-cleanup
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify and apply cleanup
        shell: bash
        run: |
          set -euo pipefail
          cat .github/cleanup.patch.gz.b64.part-* > /tmp/cleanup.patch.gz.b64
          echo "80140331edcdeea5b68c534bf0d0793ce24b5541a8918bd018edf168b90a5daa  /tmp/cleanup.patch.gz.b64" | sha256sum --check --strict
          base64 --decode /tmp/cleanup.patch.gz.b64 | gzip --decompress > /tmp/cleanup.patch
          echo "c8ea3babc9942ab6d848168e4db34b9d2fe43884faf9ba7a9de56960e80c804a  /tmp/cleanup.patch" | sha256sum --check --strict
          git apply --check /tmp/cleanup.patch
          git apply --index /tmp/cleanup.patch
          git rm .github/cleanup.patch.ready
          git rm .github/cleanup.patch.gz.b64.part-*
          git rm .github/workflows/apply-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Install anti-slop and clean up TypeScript"
          git push origin HEAD:chore/anti-slop-cleanup
